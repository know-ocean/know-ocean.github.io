# Site configuration
# 1. Files excluded from Jekyll builds
# 2. Installed Gems
# 3. Gem settings
# 4. Jekyll settings
# 5. Collections
# 6. Jekyll collections settings
# 7. Site settings
# 8. Site favicons & manifest icons
# 9. Site navigation

# 1. Files excluded from Jekyll builds
exclude:
- README.md
- CONTENT_TODO.md
- LICENSE
- CNAME
- Gemfile
- Gemfile.lock
- .jekyll-cache

# 2. Installed Gems
plugins:
- jekyll-sitemap
- jekyll-mentions
- jekyll-paginate
- jekyll-seo-tag
- jekyll-redirect-from
- jekyll-feed
- jekyll-commonmark
- jekyll-include-cache
- jemoji

# 3. Gem settings
paginate: 5 # jekyll-paginate > items per page
paginate_path: blog/page:num # jekyll-paginate > blog page
# jekyll-mentions: https://twitter.com # jekyll-mentions > service used when @replying
# twitter:
#   username: # jekyll-seo-tag > Owners twitter username
author: Jason Conner # jekyll-seo-tag > default author
social: # jekyll-seo-tag > social overrides
  name: Jason Conner # jekyll-seo-tag > real name
  links: [] # jekyll-seo-tag > social aliases (sameAs)
# markdown: CommonMark # Markdown parse settings, CommonMark performs slightly better an others in build time
# commonmark:
  # options: ["SMART", "FOOTNOTES"]
  # extensions: ["strikethrough", "autolink", "table"]

# 4. Jekyll settings
sass:
  style: compressed # Style compression
permalink: pretty  # Permalink style (/YYYY/MM/DD/page-name/)
excerpt_separator: <!-- more --> # Marks end of excerpt in posts
timezone: America/Los_Angeles # Timezone for blog posts and alike

# 5. Collections
collections:
  posts:
    title: Blog
    output: true
    description: "Stories and insights from applied marine science"
    feature_text: |
      Welcome to the KnowOcean Blog
    feature_image: "/assets/images/banner_whale_1.png"

# 6. Jekyll collections settings
defaults:
  -
    scope:
      path: ""
    values:
      image: "/assets/logos/logo_1024.png" # Default image for sharing
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: post # Set the default layout for posts
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: page # Set the default layout for pages

# 7. Site settings
encoding: utf-8 # Make sure the encoding is right
lang: en-US # Set the site language
title: "KnowOcean" # Site name or title, also used in jekyll-seo-tag
logo: "/assets/logos/logo.svg" # Site logo, also used in jekyll-seo-tag
description: "Learn about applied marine science and the real-life stories of marine biologists." # Site description and default description, also used in jekyll-seo-tag
url: "https://knowocean.org" # Site url, also used in jekyll-seo-tag
baseurl: ""
repo: "https://github.com/know-ocean/know-ocean.github.io"
# email: ""
# disqus: "" # Blog post comments, uncomment the option and set the site ID from your Disqus account
# date_format: "%-d %B %Y" # Blog post date formatting using placeholder formatting
# google_analytics: ""
# google_analytics_anonymize_ip: ""
service_worker: false # Will turn off the service worker if set to false
# short_name: "KnowOcean" # The web application short name, defaults to the site title
css_inline: true # Will insert all styles into a single <style> block in the <head> element and remove the style <link> reference

# 8. Site favicons & manifest icons
favicons: # Favicons are also used in the manifest file. Syntax is 'size: path'
  16: '/assets/logos/logo_16.png'
  32: '/assets/logos/logo_32.png'
  96: '/assets/logos/logo_96.png'
  120: '/assets/logos/logo_120.png'
  144: '/assets/logos/logo_144.png'
  180: '/assets/logos/logo_180.png'
  512: '/assets/logos/logo_512.png'
  1024: '/assets/logos/logo_1024.png'

# 9. Site navigation
navigation_header:
- title: Home
  url: /
- title: About
  url: /about/
- title: Blog
  url: /blog/
- title: Categories
  url: /categories/
- title: Search
  url: /search/

navigation_footer:
- title: KnowOcean
  url: /
- title: About
  url: /about/
- title: Blog
  url: /blog/

social_links: # Appears in sidebar. Set the urls then uncomment and comment out as desired
  # Twitter: https://twitter.com/yourhandle
  # LinkedIn: https://www.linkedin.com/in/yourprofile
  # GitHub: https://github.com/yourhandle
  # link: https://knowocean.org
  RSS: /feed.xml

sharing_links: # Appear at the bottom of single blog posts, add as desired. The value can be 'true' or the desired button colour
  Twitter: "#0d94e7"
  facebook: "#3B5998"
  Email: true

# Load custom fonts from fonts.google.com etc
#
# TIP: Try to keep the number of urls as low to reduce the performance cost
#      If multiple fonts can be requested in a single url opt for this
fonts:
  preconnect_urls:
    - https://fonts.gstatic.com
  font_urls:
    - https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap
